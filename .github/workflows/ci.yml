name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: ["claude/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test (includes wrangler --dry-run build check)
        run: npm test

      - name: Save failure log
        if: failure()
        run: |
          echo "CI failed at step: npm test (wrangler dry-run build + node --test). See job log above." > ci-failure.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-failure-log
          path: ci-failure.txt
          retention-days: 7

  report-failure:
    needs: test
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `❌ CI (npm test) が失敗しました。\n詳細はログを確認してください: ${runUrl}`,
            });
